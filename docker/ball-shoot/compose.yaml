# Mirrors ../../k3s/ball-shoot (Deployment + Service + Ingress) as a Swarm stack:
#   docker stack deploy -c compose.yaml ball-shoot
#
# No published ports — Traefik reaches this service by its endpoint on the
# `edge` overlay network.
services:
  ball-shoot:
    image: aminoa/ball-shoot:latest
    networks:
      - edge
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        traefik.enable: "true"
        traefik.http.routers.ball-shoot.rule: Host(`ball-shoot.aneeshmaganti.com`)
        traefik.http.routers.ball-shoot.entrypoints: web,websecure
        traefik.http.services.ball-shoot.loadbalancer.server.port: "80"

networks:
  edge:
    external: true
