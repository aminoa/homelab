# Mirrors ../../k3s/homelab-wiki (Deployment + Service + Ingress) as a Swarm stack:
#   docker stack deploy -c compose.yaml homelab-wiki
#
# No published ports — Traefik reaches this service by its endpoint on the
# `edge` overlay network.
services:
  homelab-wiki:
    image: aminoa/homelab-wiki:latest
    networks:
      - edge
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        traefik.enable: "true"
        traefik.http.routers.homelab-wiki.rule: Host(`homelab.aneeshmaganti.com`)
        traefik.http.routers.homelab-wiki.entrypoints: web,websecure
        traefik.http.services.homelab-wiki.loadbalancer.server.port: "80"

networks:
  edge:
    external: true
