# Komodo (https://komo.do) for managing containers on this node. Deployed as a
# Swarm stack, which keeps the volume names it already had under Compose:
#   docker stack deploy -c compose.yaml komodo
#
# Adapted from https://github.com/moghtech/komodo/blob/main/compose/ferretdb.compose.yaml
# with image versions pinned. Swarm ignores depends_on, so Core may restart a
# few times while Postgres initializes on a cold start — restart_policy covers it.
#
# Secrets come from Swarm rather than compose.env; see the `secrets` block at the
# bottom. Every consumer here reads them via a *_FILE variable, so no secret
# value is ever in this file, in the environment, or in `docker inspect`.
services:
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DATABASE_USERNAME}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: postgres
    secrets:
      - db_password
    networks:
      - default
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        komodo.skip: "" # Prevent Komodo from stopping with StopAllContainers

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.7.0
    volumes:
      - ferretdb-state:/state
    environment:
      # The whole connection URL is the secret, since the password is embedded
      # in it and FerretDB takes no separate password variable.
      FERRETDB_POSTGRESQL_URL_FILE: /run/secrets/ferretdb_url
    secrets:
      - ferretdb_url
    networks:
      - default
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        komodo.skip: ""

  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    env_file: ./compose.env
    environment:
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
      KOMODO_DATABASE_PASSWORD_FILE: /run/secrets/db_password
      KOMODO_JWT_SECRET_FILE: /run/secrets/jwt_secret
      KOMODO_WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      KOMODO_INIT_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - db_password
      - jwt_secret
      - webhook_secret
      - admin_password
    volumes:
      # Core / Periphery communication keys
      - keys:/config/keys
      # Dated database backups - https://komo.do/docs/setup/backup
      - ${COMPOSE_KOMODO_BACKUPS_PATH}:/backups
    networks:
      # `default` keeps Core talking to FerretDB; `edge` is only for Traefik.
      - default
      - edge
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        traefik.enable: "true"
        traefik.http.routers.komodo.rule: Host(`komodo.aneeshmaganti.com`)
        traefik.http.routers.komodo.entrypoints: web,websecure
        traefik.http.services.komodo.loadbalancer.server.port: "9120"

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    env_file: ./compose.env
    volumes:
      - keys:/config/keys
      # Manage the host's containers
      - /var/run/docker.sock:/var/run/docker.sock
      # See processes outside of the container
      - /proc:/proc
      # Agent root dir. Must be the same path inside and outside the container.
      - ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}:${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}
    networks:
      - default
    deploy:
      replicas: 1
      # The socket only exists on managers.
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      labels:
        komodo.skip: ""

volumes:
  postgres-data:
  ferretdb-state:
  keys:

networks:
  default:
  # Created by ../traefik; only Core joins it.
  edge:
    external: true

# Swarm secrets are immutable, so the external names carry a version suffix
# while the in-container path stays stable. To rotate: create <name>_v2, bump
# the `name:` here, redeploy, then `docker secret rm <name>_v1`.
secrets:
  db_password:
    external: true
    name: komodo_db_password_v1
  ferretdb_url:
    external: true
    name: komodo_ferretdb_url_v1
  jwt_secret:
    external: true
    name: komodo_jwt_secret_v1
  webhook_secret:
    external: true
    name: komodo_webhook_secret_v1
  admin_password:
    external: true
    name: komodo_admin_password_v1
