# Mirrors ../../k3s/shi-kara-jinsei-ga-kuru (Deployment + Service + Ingress) as a Swarm stack:
#   docker stack deploy -c compose.yaml shi-kara-jinsei-ga-kuru
#
# No published ports — Traefik reaches this service by its endpoint on the
# `edge` overlay network.
services:
  shi-kara-jinsei-ga-kuru:
    image: aminoa/shi-kara-jinsei-ga-kuru:latest
    networks:
      - edge
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        traefik.enable: "true"
        traefik.http.routers.shi-kara-jinsei-ga-kuru.rule: Host(`shi-kara-jinsei-ga-kuru.aneeshmaganti.com`)
        traefik.http.routers.shi-kara-jinsei-ga-kuru.entrypoints: web,websecure
        traefik.http.services.shi-kara-jinsei-ga-kuru.loadbalancer.server.port: "80"

networks:
  edge:
    external: true
