apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aminoa/homelab.git
    targetRevision: main
    # Watches the directory of child Application manifests. root.yaml itself lives
    # one level up (argocd/root.yaml), so the root app never manages itself.
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # New/changed child Application manifests in argocd/apps/ auto-register.
      selfHeal: true
      # prune: removing a file in argocd/apps/ deletes that Application
      # (and cascades to its workloads). Standard app-of-apps behavior.
      prune: true
