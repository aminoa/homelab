apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aminoa/homelab.git
    targetRevision: main
    path: longhorn
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  # syncPolicy intentionally left manual (safe-first): review the diff in the UI,
  # sync by hand, then add automated { prune, selfHeal } once the diff is clean.
