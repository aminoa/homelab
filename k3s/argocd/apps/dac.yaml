apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dac
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aminoa/homelab.git
    targetRevision: main
    path: k3s/dac
  destination:
    server: https://kubernetes.default.svc
    namespace: dac
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
