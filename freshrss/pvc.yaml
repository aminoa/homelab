apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freshrss-data
  namespace: freshrss
spec:
  storageClassName: longhorn-main
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freshrss-extensions
  namespace: freshrss
spec:
  storageClassName: longhorn-main
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
